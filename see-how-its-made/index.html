<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#3b3e42">
  <title>Print — USAGI Craft Lab.</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#303337;color:#f2f2ef;font-family:Arial,"Helvetica Neue","Noto Sans JP",sans-serif}
    button,input{font:inherit}
    #app{position:relative;width:100%;height:100%;background:var(--stage-bg,linear-gradient(to top,#2c2f32 0%,#555a5f 100%));transition:background .25s ease}
    #stage{position:absolute;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    canvas{display:block;width:100%;height:100%}
    .menu-button{position:absolute;top:22px;right:4vw;z-index:20;width:44px;height:44px;border:0;background:transparent;color:var(--fg,#111);cursor:pointer;padding:0;display:grid;place-items:center}
    .menu-button span,.menu-button span:before,.menu-button span:after{content:"";display:block;width:24px;height:1px;background:currentColor;position:relative;transition:.2s}
    .menu-button span:before{position:absolute;top:-7px}
    .menu-button span:after{position:absolute;top:7px}
    .hud{position:absolute;left:4vw;right:4vw;bottom:max(28px,env(safe-area-inset-bottom));z-index:10;pointer-events:none;color:var(--fg,#111)}
    .tool-list{position:absolute;left:4vw;top:50%;z-index:12;transform:translateY(-50%);color:var(--fg,#111);font-size:13px;line-height:1;letter-spacing:.01em;pointer-events:none}
    .tool-list-inner{position:relative}
    .tool-item{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;white-space:nowrap}
    .tool-color{width:9px;height:9px;border-radius:50%;flex:0 0 auto;border:1px solid color-mix(in srgb,var(--fg,#111) 22%,transparent)}
    .tool-indicator{position:absolute;left:0;top:0;width:100%;height:32px;border:1px solid currentColor;pointer-events:none;transition:transform 1s cubic-bezier(.22,.61,.36,1)}
    .progress-wrap{height:28px;display:flex;align-items:center;pointer-events:auto;touch-action:pan-y}
    .progress{position:relative;width:100%;height:2px;background:color-mix(in srgb,var(--fg,#111) 22%,transparent);cursor:pointer}
    .progress-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--fg,#111)}
    .progress-thumb{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:var(--fg,#111);transform:translate(-50%,-50%);border:0}
    .panel{position:absolute;inset:0;z-index:30;background:var(--panel-bg,#3b3e42);color:var(--fg,#f2f2ef);display:none;padding:22px 4vw 36px;overflow:auto}
    .panel.open{display:block}
    .panel-head{display:flex;justify-content:flex-end}
    .close{width:44px;height:44px;border:0;background:transparent;color:inherit;font-size:30px;line-height:1;cursor:pointer;padding:0}
    .panel-body{max-width:680px;margin:8vh 0 0 auto;width:min(100%,680px)}
    .group{border-top:1px solid color-mix(in srgb,var(--fg,#111) 32%,transparent);padding:20px 0 34px}
    .group-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 18px;opacity:.58}
    .choice{display:flex;width:100%;min-height:48px;align-items:center;justify-content:space-between;border:0;background:transparent;color:inherit;padding:0;text-align:left;cursor:pointer;font-size:clamp(22px,3.2vw,38px);letter-spacing:-.035em}
    .choice .mark{font-size:13px;opacity:0}
    .choice.active .mark{opacity:1}
    .toggle-row{display:flex;gap:8px;flex-wrap:wrap}
    .pill{min-height:44px;border:1px solid color-mix(in srgb,var(--fg,#111) 30%,transparent);background:transparent;color:inherit;padding:0 18px;border-radius:999px;cursor:pointer}
    .pill.active{background:var(--fg,#f2f2ef);color:var(--panel-bg,#3b3e42)}
    .debug-row{display:grid;grid-template-columns:1fr 58px;gap:12px;align-items:center}
    .debug-range{width:100%;accent-color:currentColor}
    .debug-value{font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
    .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.04em;opacity:.38;pointer-events:none;transition:opacity 1.2s ease;color:var(--fg,#111);white-space:nowrap}
    .hint.hide{opacity:0}
    @media(max-width:700px){
      .menu-button{top:14px;right:14px}
      .hud{left:18px;right:18px;bottom:max(20px,env(safe-area-inset-bottom))}
      .panel{padding:14px 18px 30px}
      .panel-body{margin-top:6vh}
      .tool-list{left:18px;font-size:12px}
      .tool-item,.tool-indicator{height:30px}
    }
    @media(prefers-reduced-motion:reduce){#app,.hint{transition:none}}
  </style>
</head>
<body>
  <main id="app">
    <div id="stage" aria-label="3D printing simulation"></div>

    <button class="menu-button" id="menuButton" type="button" aria-label="Open settings"><span></span></button>

    <div class="hint" id="hint">drag to change view</div>

    <div class="tool-list" id="toolList" aria-live="polite">
      <div class="tool-list-inner" id="toolListInner"></div>
    </div>

    <div class="hud">
      <div class="progress-wrap" id="progressWrap" aria-label="Print progress">
        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>
    </div>

    <aside class="panel" id="panel" aria-label="Settings">
      <div class="panel-head"><button class="close" id="closeButton" type="button" aria-label="Close settings">×</button></div>
      <div class="panel-body">
        <section class="group">
          <p class="group-label">Model</p>
          <button class="choice active" type="button" data-model="clock"><span>UKIGARA Clock</span><span class="mark">●</span></button>
          <button class="choice" type="button" data-model="vessel"><span>Vessel / test 01</span><span class="mark">●</span></button>
          <button class="choice" type="button" data-model="grid"><span>Grid / test 02</span><span class="mark">●</span></button>
        </section>
        <section class="group">
          <p class="group-label">Print head</p>
          <div class="toggle-row">
            <button class="pill active" type="button" data-head="on">On</button>
            <button class="pill" type="button" data-head="off">Off</button>
          </div>
        </section>
        <section class="group">
          <p class="group-label">Debug · Line width</p>
          <div class="debug-row">
            <input id="lineWidthDebug" class="debug-range" type="range" min="0.5" max="8" step="0.1" value="4.0" aria-label="Line width">
            <output id="lineWidthValue" class="debug-value">4.0 px</output>
          </div>
        </section>
        <section class="group">
          <p class="group-label">Background</p>
          <div class="toggle-row">
            <button class="pill" type="button" data-bg="warm">Warm white</button>
            <button class="pill" type="button" data-bg="white">White</button>
            <button class="pill active" type="button" data-bg="gray">Gray</button>
            <button class="pill" type="button" data-bg="black">Black</button>
          </div>
        </section>
      </div>
    </aside>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
    import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { CLOCK_DATA_B64 } from './clock-data.js';

    const app=document.getElementById('app');
    const stage=document.getElementById('stage');
    const toolListInner=document.getElementById('toolListInner');
    const progressWrap=document.getElementById('progressWrap');
    const progressFill=document.getElementById('progressFill');
    const progressThumb=document.getElementById('progressThumb');
    const panel=document.getElementById('panel');
    const hint=document.getElementById('hint');

    const themes={
      warm:{stage:'linear-gradient(to top,#d2cec6 0%,#f3f1ec 100%)',panel:'#f3f1ec',fg:'#111111'},
      white:{stage:'linear-gradient(to top,#d8d8d8 0%,#ffffff 100%)',panel:'#ffffff',fg:'#111111'},
      gray:{stage:'linear-gradient(to top,#2c2f32 0%,#555a5f 100%)',panel:'#3b3e42',fg:'#f2f2ef'},
      black:{stage:'linear-gradient(to top,#080808 0%,#202225 100%)',panel:'#101010',fg:'#f1f1ee'}
    };
    const tools={
      0:{name:'red',css:'#983937',three:0x983937},
      1:{name:'white',css:'#f4f4f0',three:0xf4f4f0},
      2:{name:'blue',css:'#315f9a',three:0x315f9a}
    };

    const scene=new THREE.Scene();
    scene.background=null;
    app.style.setProperty('--stage-bg',themes.gray.stage);
    app.style.setProperty('--panel-bg',themes.gray.panel);
    app.style.setProperty('--fg',themes.gray.fg);
    const camera=new THREE.PerspectiveCamera(32,1,.1,2000);
    camera.position.set(180,125,220);

    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setClearColor(0x000000,0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.enablePan=false;
    controls.enableZoom=false;
    controls.target.set(0,42,0);
    controls.minPolarAngle=Math.PI*.16;
    controls.maxPolarAngle=Math.PI*.82;
    controls.addEventListener('start',()=>hint.classList.add('hide'));

    scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.1));
    const key=new THREE.DirectionalLight(0xffffff,2.4);
    key.position.set(140,220,160);
    scene.add(key);

    const bed=new THREE.Mesh(
      new THREE.BoxGeometry(210,2.2,210),
      new THREE.MeshPhysicalMaterial({
        color:0xcfd2d0,
        roughness:.58,
        metalness:0,
        transparent:true,
        opacity:.34,
        transmission:.08,
        depthWrite:false
      })
    );
    bed.position.y=-2.2;
    scene.add(bed);

    const printedGroup=new THREE.Group();
    scene.add(printedGroup);
    const printedLines=new Map();
    const printedLineMaterials=[];

    const liveGeometry=new LineSegmentsGeometry();
    liveGeometry.setPositions([0,0,0,0,0,0]);
    let lineWidth=4.0;
    const liveMaterial=new LineMaterial({color:tools[0].three,linewidth:lineWidth,transparent:false,opacity:1,depthWrite:true});
    liveMaterial.resolution.set(stage.clientWidth||1,stage.clientHeight||1);
    const liveLine=new LineSegments2(liveGeometry,liveMaterial);
    liveLine.frustumCulled=false;
    liveLine.visible=false;
    scene.add(liveLine);

    const headGroup=new THREE.Group();

    // Lightweight MK4S / Nextruder-inspired silhouette.
    // Deliberately simplified for mobile rendering, but shaped closer to the real assembly.
    const headBlack=new THREE.MeshStandardMaterial({color:0x1d1d1d,roughness:.78,metalness:.02});
    const headDark=new THREE.MeshStandardMaterial({color:0x343434,roughness:.64,metalness:.05});
    const headOrange=new THREE.MeshStandardMaterial({color:0xf06b28,roughness:.58,metalness:.02});
    const headMetal=new THREE.MeshStandardMaterial({color:0x9d9d99,roughness:.34,metalness:.64});
    const brass=new THREE.MeshStandardMaterial({color:0xb8864b,roughness:.28,metalness:.72});

    // X-carriage / rear mounting plate
    const carriage=new THREE.Mesh(new THREE.BoxGeometry(58,9,17),headDark);
    carriage.position.set(0,37,-6);

    const rearPlate=new THREE.Mesh(new THREE.BoxGeometry(45,39,7),headDark);
    rearPlate.position.set(0,17,-16);

    // Upper extruder / motor block
    const motor=new THREE.Mesh(new THREE.BoxGeometry(31,28,31),headDark);
    motor.position.set(-3,31,-1);

    // Main front housing: two blocks give a stepped Nextruder-like silhouette
    const upperHousing=new THREE.Mesh(new THREE.BoxGeometry(43,20,34),headBlack);
    upperHousing.position.set(0,20,1);

    const lowerHousing=new THREE.Mesh(new THREE.BoxGeometry(39,19,31),headBlack);
    lowerHousing.position.set(0,2,1);

    // Orange accent / latch area
    const orangeCap=new THREE.Mesh(new THREE.BoxGeometry(44,4.5,35),headOrange);
    orangeCap.position.set(0,29.5,1);

    const orangeTab=new THREE.Mesh(new THREE.BoxGeometry(8,14,5),headOrange);
    orangeTab.position.set(-17,20,19);

    // Front fan opening
    const fanBack=new THREE.Mesh(new THREE.CylinderGeometry(12.2,12.2,4,32),headDark);
    fanBack.rotation.x=Math.PI/2;
    fanBack.position.set(0,12,19);

    const fanRing=new THREE.Mesh(new THREE.TorusGeometry(10.2,1.7,8,32),headBlack);
    fanRing.rotation.x=Math.PI/2;
    fanRing.position.set(0,12,21.3);

    const fanHub=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,3.5,20),headBlack);
    fanHub.rotation.x=Math.PI/2;
    fanHub.position.set(0,12,21.5);

    const fanBlades=new THREE.Group();
    for(let i=0;i<7;i++){
      const blade=new THREE.Mesh(new THREE.BoxGeometry(2.2,7.5,1),headBlack);
      blade.position.y=5;
      blade.rotation.z=i*Math.PI*2/7+.28;
      fanBlades.add(blade);
    }
    fanBlades.rotation.x=Math.PI/2;
    fanBlades.position.set(0,12,21.5);

    // Right-side part-cooling fan + duct, very characteristic in profile
    const sideFanHousing=new THREE.Mesh(new THREE.BoxGeometry(14,26,27),headBlack);
    sideFanHousing.position.set(27,8,-1);

    const sideFan=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.5,3.2,28),headDark);
    sideFan.rotation.z=Math.PI/2;
    sideFan.position.set(34.2,9,-1);

    const ductStem=new THREE.Mesh(new THREE.BoxGeometry(9,18,13),headBlack);
    ductStem.position.set(23,-9,3);
    ductStem.rotation.z=-0.18;

    const ductTip=new THREE.Mesh(new THREE.BoxGeometry(13,8,16),headBlack);
    ductTip.position.set(18,-20,4);
    ductTip.rotation.z=-0.38;

    // Hotend stack
    const heatsink=new THREE.Mesh(new THREE.CylinderGeometry(6.2,6.2,14,20),headMetal);
    heatsink.position.set(0,-10,0);

    const heatbreak=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,8,16),headMetal);
    heatbreak.position.set(0,-20,0);

    const heaterBlock=new THREE.Mesh(new THREE.BoxGeometry(11,7,10),headMetal);
    heaterBlock.position.set(0,-26,0);

    // V6-inspired nozzle silhouette: hex body, short taper and a visible flat at the outlet.
    const nozzleHex=new THREE.Mesh(new THREE.CylinderGeometry(5.4,5.4,4.8,6),brass);
    nozzleHex.position.y=-32.0;
    const nozzleTaper=new THREE.Mesh(new THREE.CylinderGeometry(4.5,1.7,4.6,24),brass);
    nozzleTaper.position.y=-36.7;
    const nozzleTip=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,1.4,20),brass);
    nozzleTip.position.y=-39.7;
    const nozzleOutletY=-40.4;

    // Small top filament guide
    const filamentGuide=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,15,14),headOrange);
    filamentGuide.position.set(-3,51,-1);

    headGroup.add(
      carriage,rearPlate,motor,upperHousing,lowerHousing,orangeCap,orangeTab,
      fanBack,fanRing,fanHub,fanBlades,
      sideFanHousing,sideFan,ductStem,ductTip,
      heatsink,heatbreak,heaterBlock,nozzleHex,nozzleTaper,nozzleTip,filamentGuide
    );
    scene.add(headGroup);

    let segments=[];
    let timeline=[];
    let totalDuration=0;
    let progress=0;
    let currentModel='clock';
    let seeking=false;
    let last=performance.now();
    let activeTool=null;
    let displayedTools=[];
    let toolIndicator=null;
    const toolEndTimes=new Map();

    function pushSegment(a,b,tool,{feed=1200,extrude=true}={}){
      const len=a.distanceTo(b);
      if(len<.0001)return;
      segments.push({a:a.clone(),b:b.clone(),tool,feed,extrude,len});
    }

    function decodeClockMoves(){
      const binary=atob(CLOCK_DATA_B64);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      if(bytes[0]!==85||bytes[1]!==67||bytes[2]!==76||bytes[3]!==49)throw new Error('Invalid clock data');
      const count=bytes[4]|(bytes[5]<<8)|(bytes[6]<<16)|(bytes[7]<<24);
      const feeds=[1200,3600,4800];
      let pos=8,px=0,py=0,pz=0;
      function getVar(){
        let q=0,shift=0,b;
        do{b=bytes[pos++];q|=(b&127)<<shift;shift+=7;}while(b&128);
        return (q&1)?-((q+1)>>1):(q>>1);
      }
      const moves=new Array(count);
      for(let i=0;i<count;i++){
        px+=getVar();py+=getVar();pz+=getVar();
        const flag=bytes[pos++];
        const feed=feeds[flag&3]||1200;
        const extrude=(flag&4)!==0;
        const tool=(flag>>3)&3;
        moves[i]={x:px/1000,y:py/1000,z:pz/1000,feed,extrude,tool};
      }
      return moves;
    }

    function buildClock(){
      segments=[];
      const moves=decodeClockMoves();
      if(!moves.length)return;
      let prev=new THREE.Vector3(moves[0].x,moves[0].z,moves[0].y);
      for(let i=1;i<moves.length;i++){
        const m=moves[i];
        const p=new THREE.Vector3(m.x,m.z,m.y);
        pushSegment(prev,p,m.tool,{feed:m.feed,extrude:m.extrude});
        prev=p;
      }
      controls.target.set(0,20,0);
      camera.position.set(180,115,220);
    }

    function modelToolOrder(){
      const order=[];
      for(const s of segments)if(!order.includes(s.tool))order.push(s.tool);
      return order;
    }

    function buildToolList(){
      displayedTools=modelToolOrder();
      toolListInner.innerHTML='';
      displayedTools.forEach(id=>{
        const row=document.createElement('div');
        row.className='tool-item';
        row.dataset.tool=String(id);
        const dot=document.createElement('span');
        dot.className='tool-color';
        dot.style.background=tools[id].css;
        const label=document.createElement('span');
        label.textContent='Tool '+id+': '+tools[id].name;
        row.append(dot,label);
        toolListInner.appendChild(row);
      });
      toolIndicator=document.createElement('div');
      toolIndicator.className='tool-indicator';
      toolListInner.appendChild(toolIndicator);
      activeTool=displayedTools[0]??0;
      moveToolIndicator(activeTool,false);
    }

    function moveToolIndicator(toolId,animate=true){
      if(!toolIndicator)return;
      const index=Math.max(0,displayedTools.indexOf(toolId));
      const row=toolListInner.querySelector('.tool-item');
      const rowHeight=row?row.getBoundingClientRect().height:32;
      toolIndicator.style.transitionDuration=animate?'1s':'0s';
      toolIndicator.style.transform='translateY('+(index*rowHeight)+'px)';
      if(!animate)requestAnimationFrame(()=>{if(toolIndicator)toolIndicator.style.transitionDuration='1s'});
      activeTool=toolId;
    }

    function buildVessel(){
      segments=[];
      const layers=44,points=76;
      let previous=null;
      for(let l=0;l<layers;l++){
        const y=1.4+l*1.65;
        const t=l/(layers-1);
        const radius=34+8*Math.sin(t*Math.PI)-3*t;
        const tool=l<16?0:(l<29?1:0);
        for(let i=0;i<=points;i++){
          const a=(i/points)*Math.PI*2+l*.055;
          const wobble=1+0.035*Math.sin(a*3+l*.22);
          const p=new THREE.Vector3(Math.cos(a)*radius*wobble,y,Math.sin(a)*radius*wobble);
          if(previous)pushSegment(previous,p,tool,{feed:1200,extrude:true});
          previous=p;
        }
      }
      controls.target.set(0,42,0);
      camera.position.set(180,125,220);
    }

    function buildGrid(){
      segments=[];
      let prev=null;
      const layers=34;
      for(let l=0;l<layers;l++){
        const y=1.5+l*1.8;
        const tool=l<11?2:(l<23?0:1);
        const size=68-l*.35;
        const pts=[
          new THREE.Vector3(-size/2,y,-size/2),
          new THREE.Vector3(size/2,y,-size/2),
          new THREE.Vector3(size/2,y,size/2),
          new THREE.Vector3(-size/2,y,size/2),
          new THREE.Vector3(-size/2,y,-size/2)
        ];
        for(const p of pts){if(prev)pushSegment(prev,p,tool,{feed:1200,extrude:true});prev=p}
        const stripes=7;
        for(let s=0;s<stripes;s++){
          const q=-size/2+(size/(stripes-1))*s;
          const a=l%2===0?new THREE.Vector3(-size/2,y,q):new THREE.Vector3(q,y,-size/2);
          const b=l%2===0?new THREE.Vector3(size/2,y,q):new THREE.Vector3(q,y,size/2);
          pushSegment(prev,a,tool,{feed:3600,extrude:false});
          pushSegment(a,b,tool,{feed:1200,extrude:true});
          prev=b;
        }
      }
      controls.target.set(0,32,0);
      camera.position.set(180,125,220);
    }

    function isAirPrintSegment(s){
      return currentModel==='clock' && s.extrude && s.tool===2;
    }

    function sagAmountFor(segment){
      return Math.min(9,Math.max(.08,segment.len*.16));
    }

    function appendSaggedSegment(target,segment,steps=14){
      let previous=segment.a.clone();
      const sag=sagAmountFor(segment);
      for(let i=1;i<=steps;i++){
        const t=i/steps;
        const p=segment.a.clone().lerp(segment.b,t);
        p.y-=sag*4*t*(1-t);
        target.push(previous.x,previous.y,previous.z,p.x,p.y,p.z);
        previous=p;
      }
    }

    function buildTimeline(){
      timeline=[];
      toolEndTimes.clear();
      totalDuration=0;
      if(!segments.length)return;
      let previousTool=segments[0].tool;
      let point=segments[0].a.clone();
      for(const s of segments){
        if(s.tool!==previousTool){
          const pause={type:'pause',start:totalDuration,end:totalDuration+3,fromTool:previousTool,toTool:s.tool,point:point.clone()};
          timeline.push(pause);
          totalDuration+=3;
          previousTool=s.tool;
        }
        const seconds=s.len/Math.max(.001,s.feed/60);
        const move={type:'move',start:totalDuration,end:totalDuration+seconds,segment:s};
        timeline.push(move);
        totalDuration+=seconds;
        s.timelineEnd=move.end;
        point=s.b;
        if(s.extrude){
          if(!toolEndTimes.has(s.tool))toolEndTimes.set(s.tool,[]);
          toolEndTimes.get(s.tool).push(move.end);
        }
      }
    }

    function clearPrinted(){
      for(const line of printedLines.values()){
        printedGroup.remove(line);
        line.geometry.dispose();
        line.material.dispose();
      }
      printedLines.clear();
      printedLineMaterials.length=0;
    }

    const renderedEndTimes=new Map();

    function buildPrintedLines(){
      clearPrinted();
      renderedEndTimes.clear();
      const byTool=new Map();
      for(const s of segments){
        if(!s.extrude)continue;
        if(!byTool.has(s.tool))byTool.set(s.tool,[]);
        if(!renderedEndTimes.has(s.tool))renderedEndTimes.set(s.tool,[]);
        const a=byTool.get(s.tool);
        const times=renderedEndTimes.get(s.tool);
        if(isAirPrintSegment(s)){
          const before=a.length;
          appendSaggedSegment(a,s,14);
          const generated=(a.length-before)/6;
          for(let i=0;i<generated;i++)times.push(s.timelineEnd);
        }else{
          a.push(s.a.x,s.a.y,s.a.z,s.b.x,s.b.y,s.b.z);
          times.push(s.timelineEnd);
        }
      }
      for(const [toolId,positions] of byTool){
        const geometry=new LineSegmentsGeometry();
        geometry.setPositions(positions);
        geometry.instanceCount=0;
        const material=new LineMaterial({
          color:tools[toolId].three,
          linewidth:lineWidth,
          transparent:false,
          opacity:1,
          depthWrite:true
        });
        material.resolution.set(stage.clientWidth||1,stage.clientHeight||1);
        const line=new LineSegments2(geometry,material);
        line.frustumCulled=false;
        printedGroup.add(line);
        printedLines.set(toolId,line);
        printedLineMaterials.push(material);
      }
    }

    function upperBound(arr,value){
      let lo=0,hi=arr.length;
      while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<=value)lo=mid+1;else hi=mid}
      return lo;
    }

    function timelineEntryAt(time){
      let lo=0,hi=timeline.length-1;
      while(lo<hi){const mid=(lo+hi)>>1;if(timeline[mid].end<time)lo=mid+1;else hi=mid}
      return timeline[lo];
    }

    function renderLiveExtrusion(segment,part,currentPoint){
      if(!segment?.extrude || part<=0 || part>=1){
        liveLine.visible=false;
        return;
      }
      const positions=[];
      if(isAirPrintSegment(segment)){
        // While a free-air strand is being drawn, let it hang from the last
        // supported point and tighten again as the nozzle reaches the far side.
        const steps=14;
        const liveLength=segment.a.distanceTo(currentPoint);
        const sag=Math.min(9,Math.max(.08,liveLength*.16));
        let previous=segment.a.clone();
        for(let i=1;i<=steps;i++){
          const t=i/steps;
          const p=segment.a.clone().lerp(currentPoint,t);
          p.y-=sag*4*t*(1-t);
          positions.push(previous.x,previous.y,previous.z,p.x,p.y,p.z);
          previous=p;
        }
      }else{
        positions.push(segment.a.x,segment.a.y,segment.a.z,currentPoint.x,currentPoint.y,currentPoint.z);
      }
      liveGeometry.setPositions(positions);
      liveMaterial.color.setHex(tools[segment.tool].three);
      liveLine.visible=true;
    }

    function renderProgress(animateIndicator=true){
      if(!timeline.length||!totalDuration)return;
      const time=Math.max(0,Math.min(totalDuration,progress*totalDuration));
      const entry=timelineEntryAt(time);
      let currentPoint=segments[0].a.clone();
      let desiredTool=segments[0].tool;
      let animateTool=false;

      if(entry.type==='pause'){
        currentPoint=entry.point.clone();
        liveLine.visible=false;
        const remaining=entry.end-time;
        if(remaining<=1){
          desiredTool=entry.toTool;
          animateTool=animateIndicator;
        }else{
          desiredTool=entry.fromTool;
        }
      }else{
        const s=entry.segment;
        const span=Math.max(.0001,entry.end-entry.start);
        const part=Math.max(0,Math.min(1,(time-entry.start)/span));
        currentPoint=s.a.clone().lerp(s.b,part);
        desiredTool=s.tool;
        renderLiveExtrusion(s,part,currentPoint);
      }

      if(desiredTool!==activeTool)moveToolIndicator(desiredTool,animateTool);

      for(const [toolId,line] of printedLines){
        line.geometry.instanceCount=upperBound(renderedEndTimes.get(toolId)||[],time);
      }

      // The G-code position is the physical extrusion point. Offset the visual
      // head so the flat nozzle outlet, not the group's origin, sits there.
      headGroup.position.copy(currentPoint);
      headGroup.position.y-=nozzleOutletY;
      const pct=Math.max(0,Math.min(100,progress*100));
      progressFill.style.width=pct+'%';
      progressThumb.style.left=pct+'%';
    }

    function setModel(name){
      currentModel=name;
      if(name==='clock')buildClock();
      else if(name==='grid')buildGrid();
      else buildVessel();
      progress=0;
      buildToolList();
      buildTimeline();
      buildPrintedLines();
      renderProgress(false);
      document.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('active',b.dataset.model===name));
      panel.classList.remove('open');
      last=performance.now();
    }

    function seekFromEvent(e){
      const bar=progressWrap.querySelector('.progress').getBoundingClientRect();
      progress=Math.max(0,Math.min(1,(e.clientX-bar.left)/bar.width));
      renderProgress(false);
      last=performance.now();
    }
    progressWrap.addEventListener('pointerdown',e=>{
      seeking=true;progressWrap.setPointerCapture(e.pointerId);seekFromEvent(e);
    });
    progressWrap.addEventListener('pointermove',e=>{if(seeking)seekFromEvent(e)});
    progressWrap.addEventListener('pointerup',e=>{
      seeking=false;progressWrap.releasePointerCapture(e.pointerId);last=performance.now();
    });
    progressWrap.addEventListener('pointercancel',()=>{seeking=false;last=performance.now()});

    // Prevent iOS double-tap zoom while keeping single-tap and drag interactions.
    let lastTouchEnd=0;
    document.addEventListener('touchend',e=>{
      const now=Date.now();
      if(now-lastTouchEnd<=300)e.preventDefault();
      lastTouchEnd=now;
    },{passive:false});
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});

    document.getElementById('menuButton').addEventListener('click',()=>panel.classList.add('open'));
    document.getElementById('closeButton').addEventListener('click',()=>panel.classList.remove('open'));
    document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>setModel(b.dataset.model)));
    document.querySelectorAll('[data-head]').forEach(b=>b.addEventListener('click',()=>{
      const on=b.dataset.head==='on';
      headGroup.visible=on;
      document.querySelectorAll('[data-head]').forEach(x=>x.classList.toggle('active',x===b));
    }));
    document.querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click',()=>{
      const theme=themes[b.dataset.bg];
      app.style.setProperty('--stage-bg',theme.stage);
      app.style.setProperty('--panel-bg',theme.panel);
      app.style.setProperty('--fg',theme.fg);
      scene.background=null;
      document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('active',x===b));
    }));

    function resize(){
      const w=stage.clientWidth,h=stage.clientHeight;
      renderer.setSize(w,h,false);
      camera.aspect=w/h;camera.updateProjectionMatrix();
      printedLineMaterials.forEach(m=>m.resolution.set(w,h));
      liveMaterial.resolution.set(w,h);
    }
    window.addEventListener('resize',resize);
    resize();

    const lineWidthDebug=document.getElementById('lineWidthDebug');
    const lineWidthValue=document.getElementById('lineWidthValue');
    function applyLineWidth(value){
      lineWidth=Math.round(Number(value)*10)/10;
      lineWidthValue.value=lineWidth.toFixed(1)+' px';
      liveMaterial.linewidth=lineWidth;
      printedLineMaterials.forEach(m=>m.linewidth=lineWidth);
    }
    lineWidthDebug.addEventListener('input',e=>applyLineWidth(e.target.value));
    applyLineWidth(lineWidthDebug.value);

    setModel('clock');

    function animate(now){
      requestAnimationFrame(animate);
      const dt=Math.min(.05,(now-last)/1000);
      last=now;
      if(!seeking && !panel.classList.contains('open') && progress<1 && totalDuration>0){
        progress=Math.min(1,progress+dt/totalDuration);
        renderProgress(true);
      }
      controls.update();
      renderer.render(scene,camera);
    }
    requestAnimationFrame(animate);
    setTimeout(()=>hint.classList.add('hide'),3200);
  </script>
</body>
</html>
