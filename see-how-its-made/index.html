<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Print — USAGI Craft Lab.</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#111;font-family:Arial,"Helvetica Neue","Noto Sans JP",sans-serif}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    button{touch-action:manipulation}
    .progress-wrap{touch-action:none}
    #app{position:relative;width:100%;height:100%;background:#fff}
    #stage{position:absolute;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    canvas{display:block;width:100%;height:100%}

    header{height:64px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;position:absolute;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
    .logo{font-weight:700}
    .tools{display:flex;align-items:center;gap:20px}
    .lang button,.hamb{border:0;background:none;padding:0;cursor:pointer;font:inherit}
    .lang{font-size:12px}
    .lang button.active{text-decoration:underline}
    .hamb{font-size:24px}
    .overlay{position:fixed;inset:0;background:#fff;z-index:200;padding:22px 4vw;display:none}
    .overlay.open{display:block}
    .menuhead{display:flex;justify-content:space-between}
    .close{border:0;background:none;font-size:28px}
    .menulinks{margin-top:12vh}
    .menulinks a{display:block;font-size:clamp(36px,6.5vw,78px);line-height:1.16;letter-spacing:-.05em}
    .external{margin-top:50px;display:flex;gap:25px;font-size:14px}

    .head-control{position:absolute;top:64px;left:4vw;z-index:20;display:flex;align-items:center;gap:12px;height:48px;font-size:12px;color:#111}
    .head-control-label{opacity:.55}
    .head-toggle{border:0;background:none;padding:0;cursor:pointer;color:#111}
    .head-toggle.active{text-decoration:underline}

    .hud{position:absolute;left:4vw;right:4vw;bottom:max(28px,env(safe-area-inset-bottom));z-index:10;pointer-events:none;color:#111}
    .tool-list{position:absolute;left:4vw;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 52px);z-index:12;color:#111;font-size:13px;line-height:1;letter-spacing:.01em;pointer-events:none}
    .tool-list-inner{position:relative}
    .tool-item{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;white-space:nowrap}
    .tool-color{width:9px;height:9px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(17,17,17,.22)}
    .tool-indicator{position:absolute;left:0;top:0;width:100%;height:32px;border:1px solid currentColor;pointer-events:none;transition:transform 1s cubic-bezier(.22,.61,.36,1)}
    .progress-wrap{height:28px;display:flex;align-items:center;pointer-events:auto;touch-action:pan-y}
    .progress{position:relative;width:100%;height:2px;background:rgba(17,17,17,.22);cursor:pointer}
    .progress-fill{position:absolute;inset:0 auto 0 0;width:0;background:#111}
    .progress-thumb{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:#111;transform:translate(-50%,-50%);border:0}

    .model-list{position:absolute;right:4vw;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 52px);z-index:15;display:flex;flex-direction:column;align-items:flex-end;font-size:13px;line-height:1.2}
    .model-choice{min-height:30px;border:0;background:none;color:#111;padding:0;display:flex;align-items:center;gap:9px;cursor:pointer;text-align:right}
    .model-choice .mark{font-size:9px;opacity:0}
    .model-choice.active .mark{opacity:1}

    .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.04em;opacity:.38;pointer-events:none;transition:opacity 1.2s ease;color:#111;white-space:nowrap}
    .hint.hide{opacity:0}
    [data-en]{display:none}
    body.en [data-ja]{display:none}
    body.en [data-en]{display:initial}

    @media(max-width:700px){
      header{height:60px;padding:0 18px}
      .overlay{padding:20px 18px}
      .head-control{top:60px;left:18px;height:44px}
      .hud{left:18px;right:18px;bottom:max(20px,env(safe-area-inset-bottom))}
      .tool-list{left:18px;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 48px);font-size:12px}
      .tool-item,.tool-indicator{height:30px}
      .model-list{right:18px;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 48px);font-size:12px}
      .model-choice{min-height:28px}
    }
    @media(prefers-reduced-motion:reduce){.hint{transition:none}}
  </style>
</head>
<body>
  <main id="app">
    <div id="stage" aria-label="3D printing simulation"></div>

    <header>
      <a class="logo" href="../index.html">USAGI Craft Lab.</a>
      <div class="tools">
        <div class="lang"><button data-setlang="ja" class="active">JP</button> / <button data-setlang="en">EN</button></div>
        <button class="hamb" type="button" aria-label="Menu">☰</button>
      </div>
    </header>
    <div class="overlay">
      <div class="menuhead"><b>USAGI Craft Lab.</b><button class="close" type="button" aria-label="Close menu">×</button></div>
      <nav class="menulinks">
        <a href="../index.html">Home</a>
        <a href="../works.html">Works</a>
        <a href="../techniques.html">Approach</a>
        <a href="./">Making</a>
        <a href="../index.html#contact">Contact</a>
      </nav>
      <div class="external">
        <a href="https://usagi-craft-lab.booth.pm/" target="_blank" rel="noopener">Shop ↗</a>
        <a href="https://instagram.com/usagi_craft_lab/" target="_blank" rel="noopener">Instagram ↗</a>
        <a href="https://x.com/usagi_craft_lab" target="_blank" rel="noopener">X ↗</a>
      </div>
    </div>

    <div class="head-control" aria-label="Print head">
      <span class="head-control-label">Print head</span>
      <button class="head-toggle active" type="button" data-head="on">On</button>
      <span>/</span>
      <button class="head-toggle" type="button" data-head="off">Off</button>
    </div>

    <div class="hint" id="hint">drag to change view</div>

    <div class="tool-list" id="toolList" aria-live="polite">
      <div class="tool-list-inner" id="toolListInner"></div>
    </div>

    <div class="model-list" aria-label="Model">
      <button class="model-choice active" type="button" data-model="clock"><span>UKIGARA Clock</span><span class="mark">●</span></button>
      <button class="model-choice" type="button" data-model="gradient"><span>Gradient</span><span class="mark">●</span></button>
      <button class="model-choice" type="button" data-model="gunyaBody"><span>Gunya Drawer · Body</span><span class="mark">●</span></button>
      <button class="model-choice" type="button" data-model="gunyaTrays"><span>Gunya Drawer · Tray</span><span class="mark">●</span></button>
      <button class="model-choice" type="button" data-model="cardOuter"><span>Card Case · Outer</span><span class="mark">●</span></button>
      <button class="model-choice" type="button" data-model="cardInner"><span>Card Case · Inner</span><span class="mark">●</span></button>
    </div>

    <div class="hud">
      <div class="progress-wrap" id="progressWrap" aria-label="Print progress">
        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
    import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { CLOCK_DATA_B64 } from './clock-data.js';

    const app=document.getElementById('app');
    const stage=document.getElementById('stage');
    const toolListInner=document.getElementById('toolListInner');
    const progressWrap=document.getElementById('progressWrap');
    const progressFill=document.getElementById('progressFill');
    const progressThumb=document.getElementById('progressThumb');
    const hint=document.getElementById('hint');

    const modelConfigs={
      clock:{
        tools:{
          0:{name:'red',css:'#9F2019',three:0x9F2019,opacity:1},
          1:{name:'white',css:'#F2F6FA',three:0xF2F6FA,opacity:1},
          2:{name:'blue',css:'#315f9a',three:0x315f9a,opacity:1}
        },targetY:20,camera:[180,115,220]
      },
      gradient:{
        data:'data-gradient.txt',
        tools:{
          0:{name:'red',css:'#9F2019',three:0x9F2019,opacity:1},
          1:{name:'beige',css:'#F1D3D5',three:0xF1D3D5,opacity:1}
        },targetY:16,camera:[175,105,215]
      },
      gunyaBody:{
        data:'data-gunya-body.txt',
        tools:{0:{name:'navy',css:'#223B59',three:0x223B59,opacity:1}},
        targetY:24,camera:[180,120,220]
      },
      gunyaTrays:{
        data:'data-gunya-trays.txt',
        tools:{
          0:{name:'yellow',css:'#FFB81C',three:0xFFB81C,opacity:1}
        },targetY:16,camera:[190,110,235]
      },
      cardOuter:{
        data:['data-card-outer-0.txt','data-card-outer-1.txt','data-card-outer-2.txt'],
        tools:{0:{name:'Transparent',css:'#E5F0F5',three:0xE5F0F5,opacity:.56,sparkle:true}},
        targetY:48,camera:[170,105,215]
      },
      cardInner:{
        data:'data-card-inner.txt',
        tools:{0:{name:'blue',css:'#9FB9D8',three:0x9FB9D8,opacity:1}},
        targetY:30,camera:[175,110,220]
      }
    };
    let tools=modelConfigs.clock.tools;

    const scene=new THREE.Scene();
    scene.background=null;
    app.style.background='#ffffff';
    const camera=new THREE.PerspectiveCamera(32,1,.1,2000);
    camera.position.set(180,125,220);

    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setClearColor(0x000000,0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.enablePan=false;
    controls.enableZoom=false;
    controls.target.set(0,42,0);
    controls.minPolarAngle=Math.PI*.16;
    controls.maxPolarAngle=Math.PI*.82;
    controls.addEventListener('start',()=>hint.classList.add('hide'));

    scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.1));
    const key=new THREE.DirectionalLight(0xffffff,2.4);
    key.position.set(140,220,160);
    scene.add(key);

    const bed=new THREE.Mesh(
      new THREE.BoxGeometry(210,2.2,210),
      new THREE.MeshPhysicalMaterial({
        color:0xcfd2d0,
        roughness:.58,
        metalness:0,
        transparent:true,
        opacity:.34,
        transmission:.08,
        depthWrite:false
      })
    );
    bed.position.y=-0.55;
    scene.add(bed);

    const printedGroup=new THREE.Group();
    scene.add(printedGroup);
    const printedLines=new Map();
    const printedLineMaterials=[];

    function applyExtrusionShading(material,style={}){
      const source='gl_FragColor = vec4( diffuseColor.rgb, alpha );';
      const sparkle=style.sparkle ? `
        float uclNoise = fract(sin(dot(vUv,vec2(91.7,173.3)))*43758.5453);
        float uclSparkle = smoothstep(0.955,0.995,uclNoise) * (0.28 + 0.72*uclRound);
        uclFilament += vec3(uclSparkle*0.72);
      ` : '';
      const shaded=`
        float uclCross = clamp( vUv.x, -1.0, 1.0 );
        float uclRound = sqrt( max( 0.0, 1.0 - uclCross * uclCross ) );
        float uclLight = 0.54 + 0.43 * uclRound;
        float uclHighlight = exp( -pow( ( uclCross + 0.34 ) / 0.17, 2.0 ) ) * 0.24;
        float uclShade = clamp( uclLight + uclHighlight, 0.50, 1.16 );
        vec3 uclFilament = diffuseColor.rgb * uclShade;
        ${sparkle}
        gl_FragColor = vec4( uclFilament, alpha );
      `;
      if(!material.fragmentShader.includes(source))throw new Error('Line shader hook not found');
      material.fragmentShader=material.fragmentShader.replace(source,shaded);
      material.needsUpdate=true;
      return material;
    }

    const liveGeometry=new LineSegmentsGeometry();
    liveGeometry.setPositions([0,0,0,0,0,0]);
    let lineWidth=3.8;
    const liveMaterial=new LineMaterial({color:tools[0].three,linewidth:lineWidth,transparent:false,opacity:1,depthWrite:true});
    applyExtrusionShading(liveMaterial);
    liveMaterial.resolution.set(stage.clientWidth||1,stage.clientHeight||1);
    const liveLine=new LineSegments2(liveGeometry,liveMaterial);
    liveLine.frustumCulled=false;
    liveLine.visible=false;
    scene.add(liveLine);

    const headGroup=new THREE.Group();

    // Minimal hotend view: heater block + dimensioned V6-style nozzle.
    // Reference proportions: 12.5 mm overall nozzle length, 7.5 mm M6 thread,
    // 7.0 mm hex across flats. The nozzle outlet is the G-code XYZ anchor.
    const brass=new THREE.MeshStandardMaterial({
      color:0xb8864b,roughness:.27,metalness:.72
    });
    const blockMetal=new THREE.MeshStandardMaterial({
      color:0x8f969b,roughness:.38,metalness:.66
    });

    // Heater block. The M6 threaded section passes through the block as on a real hotend.
    const heaterBlock=new THREE.Mesh(new THREE.BoxGeometry(16,9,12),blockMetal);
    heaterBlock.position.set(0,-3.75,0);

    // V6 nozzle, oriented for printing: M6 thread at the top, tip downward.
    // M6 major diameter = 6 mm, threaded length = 7.5 mm.
    const nozzleThread=new THREE.Mesh(new THREE.CylinderGeometry(3,3,7.5,32),brass);
    nozzleThread.position.y=-3.75;

    // Lightweight thread suggestion without building an expensive helical mesh.
    const threadRings=new THREE.Group();
    for(let i=0;i<7;i++){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(3.04,.13,6,24),brass);
      ring.rotation.x=Math.PI/2;
      ring.position.y=-.65-i*1.0;
      threadRings.add(ring);
    }

    // A regular hexagon with 7 mm across flats has a 4.041 mm circumradius.
    const nozzleHex=new THREE.Mesh(new THREE.CylinderGeometry(4.041,4.041,2.5,6),brass);
    nozzleHex.position.y=-8.75;

    // Remaining 2.5 mm forms the short V6 tip: taper plus a small flat outlet land.
    const nozzleTaper=new THREE.Mesh(new THREE.CylinderGeometry(3.0,.72,2.1,32),brass);
    nozzleTaper.position.y=-11.05;
    const nozzleTip=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.4,24),brass);
    nozzleTip.position.y=-12.30;
    const nozzleOutletY=-12.50;

    headGroup.add(heaterBlock,nozzleThread,threadRings,nozzleHex,nozzleTaper,nozzleTip);
    scene.add(headGroup);

    let segments=[];
    let timeline=[];
    let totalDuration=0;
    let progress=0;
    let currentModel='clock';
    let seeking=false;
    let last=performance.now();
    let activeTool=null;
    let displayedTools=[];
    let toolIndicator=null;
    const toolEndTimes=new Map();

    function pushSegment(a,b,tool,{feed=1200,extrude=true}={}){
      const len=a.distanceTo(b);
      if(len<.0001)return;
      segments.push({a:a.clone(),b:b.clone(),tool,feed,extrude,len});
    }

    function decodeClockMoves(){
      const binary=atob(CLOCK_DATA_B64);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      if(bytes[0]!==85||bytes[1]!==67||bytes[2]!==76||bytes[3]!==49)throw new Error('Invalid clock data');
      const count=bytes[4]|(bytes[5]<<8)|(bytes[6]<<16)|(bytes[7]<<24);
      const feeds=[1200,3600,4800];
      let pos=8,px=0,py=0,pz=0;
      function getVar(){
        let q=0,shift=0,b;
        do{b=bytes[pos++];q|=(b&127)<<shift;shift+=7;}while(b&128);
        return (q&1)?-((q+1)>>1):(q>>1);
      }
      const moves=new Array(count);
      for(let i=0;i<count;i++){
        px+=getVar();py+=getVar();pz+=getVar();
        const flag=bytes[pos++];
        const feed=feeds[flag&3]||1200;
        const extrude=(flag&4)!==0;
        const tool=(flag>>3)&3;
        moves[i]={x:px/1000,y:py/1000,z:pz/1000,feed,extrude,tool};
      }
      return moves;
    }

    const printDataCache=new Map();
    async function decodePackedPrint(url){
      if(printDataCache.has(url))return printDataCache.get(url);
      const urls=Array.isArray(url)?url:[url];
      const encoded=(await Promise.all(urls.map(async part=>(await (await fetch(part,{cache:'no-store'})).text()).trim()))).join('');
      const compressed=Uint8Array.from(atob(encoded),ch=>ch.charCodeAt(0));
      const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
      if(bytes[0]!==85||bytes[1]!==67||bytes[2]!==76||bytes[3]!==50)throw new Error('Invalid print data');
      const count=bytes[4]|(bytes[5]<<8)|(bytes[6]<<16)|(bytes[7]<<24);
      let pos=8,px=0,py=0,pz=0;
      function getVar(){
        let q=0,shift=0,b;
        do{b=bytes[pos++];q|=(b&127)<<shift;shift+=7;}while(b&128);
        return q>>>0;
      }
      function unzig(q){return (q&1)?-((q+1)>>1):(q>>1)}
      const moves=new Array(count);
      for(let i=0;i<count;i++){
        px+=unzig(getVar());py+=unzig(getVar());pz+=unzig(getVar());
        const feed=getVar();
        const flag=bytes[pos++];
        moves[i]={x:px/1000,y:py/1000,z:pz/1000,feed,extrude:(flag&1)!==0,tool:flag>>1};
      }
      printDataCache.set(url,moves);
      return moves;
    }

    function movesToSegments(moves){
      segments=[];
      if(!moves.length)return;
      let prev=new THREE.Vector3(moves[0].x,moves[0].z,moves[0].y);
      for(let i=1;i<moves.length;i++){
        const m=moves[i];
        const p=new THREE.Vector3(m.x,m.z,m.y);
        pushSegment(prev,p,m.tool,{feed:m.feed,extrude:m.extrude});
        prev=p;
      }
    }

    async function buildPackedModel(name){
      const config=modelConfigs[name];
      let moves=(await decodePackedPrint(config.data)).map(m=>({...m}));
      if(name==='gradient'){
        const firstZ=Math.min(...moves.filter(m=>m.extrude).map(m=>m.z));
        moves=moves.map(m=>(m.extrude&&Math.abs(m.z-firstZ)<.001)?{...m,tool:1}:m);
      }
      movesToSegments(moves);
      controls.target.set(0,config.targetY,0);
      camera.position.set(...config.camera);
    }

    function buildClock(){
      const moves=decodeClockMoves().map(m=>({...m}));
      if(moves.length){
        const first=moves[0];
        moves.unshift({...first,x:-125,feed:4800,extrude:false});
      }
      movesToSegments(moves);
      controls.target.set(0,modelConfigs.clock.targetY,0);
      camera.position.set(...modelConfigs.clock.camera);
    }

    function modelToolOrder(){
      const order=[];
      for(const s of segments)if(!order.includes(s.tool))order.push(s.tool);
      return order;
    }

    function buildToolList(){
      displayedTools=modelToolOrder();
      toolListInner.innerHTML='';
      displayedTools.forEach(id=>{
        const row=document.createElement('div');
        row.className='tool-item';
        row.dataset.tool=String(id);
        const dot=document.createElement('span');
        dot.className='tool-color';
        dot.style.background=tools[id].css;
        const label=document.createElement('span');
        label.textContent='Tool '+(id+1)+': '+tools[id].name;
        row.append(dot,label);
        toolListInner.appendChild(row);
      });
      toolIndicator=document.createElement('div');
      toolIndicator.className='tool-indicator';
      toolListInner.appendChild(toolIndicator);
      activeTool=displayedTools[0]??0;
      moveToolIndicator(activeTool,false);
    }

    function moveToolIndicator(toolId,animate=true){
      if(!toolIndicator)return;
      const index=Math.max(0,displayedTools.indexOf(toolId));
      const row=toolListInner.querySelector('.tool-item');
      const rowHeight=row?row.getBoundingClientRect().height:32;
      toolIndicator.style.transitionDuration=animate?'1s':'0s';
      toolIndicator.style.transform='translateY('+(index*rowHeight)+'px)';
      if(!animate)requestAnimationFrame(()=>{if(toolIndicator)toolIndicator.style.transitionDuration='1s'});
      activeTool=toolId;
    }

    function buildVessel(){
      segments=[];
      const layers=44,points=76;
      let previous=null;
      for(let l=0;l<layers;l++){
        const y=1.4+l*1.65;
        const t=l/(layers-1);
        const radius=34+8*Math.sin(t*Math.PI)-3*t;
        const tool=l<16?0:(l<29?1:0);
        for(let i=0;i<=points;i++){
          const a=(i/points)*Math.PI*2+l*.055;
          const wobble=1+0.035*Math.sin(a*3+l*.22);
          const p=new THREE.Vector3(Math.cos(a)*radius*wobble,y,Math.sin(a)*radius*wobble);
          if(previous)pushSegment(previous,p,tool,{feed:1200,extrude:true});
          previous=p;
        }
      }
      controls.target.set(0,42,0);
      camera.position.set(180,125,220);
    }

    function buildGrid(){
      segments=[];
      let prev=null;
      const layers=34;
      for(let l=0;l<layers;l++){
        const y=1.5+l*1.8;
        const tool=l<11?2:(l<23?0:1);
        const size=68-l*.35;
        const pts=[
          new THREE.Vector3(-size/2,y,-size/2),
          new THREE.Vector3(size/2,y,-size/2),
          new THREE.Vector3(size/2,y,size/2),
          new THREE.Vector3(-size/2,y,size/2),
          new THREE.Vector3(-size/2,y,-size/2)
        ];
        for(const p of pts){if(prev)pushSegment(prev,p,tool,{feed:1200,extrude:true});prev=p}
        const stripes=7;
        for(let s=0;s<stripes;s++){
          const q=-size/2+(size/(stripes-1))*s;
          const a=l%2===0?new THREE.Vector3(-size/2,y,q):new THREE.Vector3(q,y,-size/2);
          const b=l%2===0?new THREE.Vector3(size/2,y,q):new THREE.Vector3(q,y,size/2);
          pushSegment(prev,a,tool,{feed:3600,extrude:false});
          pushSegment(a,b,tool,{feed:1200,extrude:true});
          prev=b;
        }
      }
      controls.target.set(0,32,0);
      camera.position.set(180,125,220);
    }

    function buildTimeline(){
      timeline=[];
      toolEndTimes.clear();
      totalDuration=0;
      if(!segments.length)return;
      let previousTool=segments[0].tool;
      let point=segments[0].a.clone();
      for(const s of segments){
        if(s.tool!==previousTool){
          const pause={type:'pause',start:totalDuration,end:totalDuration+3,fromTool:previousTool,toTool:s.tool,point:point.clone()};
          timeline.push(pause);
          totalDuration+=3;
          previousTool=s.tool;
        }
        const seconds=s.len/Math.max(.001,s.feed/60);
        const move={type:'move',start:totalDuration,end:totalDuration+seconds,segment:s};
        timeline.push(move);
        totalDuration+=seconds;
        s.timelineEnd=move.end;
        point=s.b;
        if(s.extrude){
          if(!toolEndTimes.has(s.tool))toolEndTimes.set(s.tool,[]);
          toolEndTimes.get(s.tool).push(move.end);
        }
      }
    }

    function clearPrinted(){
      for(const line of printedLines.values()){
        printedGroup.remove(line);
        line.geometry.dispose();
        line.material.dispose();
      }
      printedLines.clear();
      printedLineMaterials.length=0;
    }

    const renderedEndTimes=new Map();

    function buildPrintedLines(){
      clearPrinted();
      renderedEndTimes.clear();
      const byTool=new Map();
      for(const s of segments){
        if(!s.extrude)continue;
        if(!byTool.has(s.tool))byTool.set(s.tool,[]);
        if(!renderedEndTimes.has(s.tool))renderedEndTimes.set(s.tool,[]);
        const a=byTool.get(s.tool);
        const times=renderedEndTimes.get(s.tool);
        a.push(s.a.x,s.a.y,s.a.z,s.b.x,s.b.y,s.b.z);
        times.push(s.timelineEnd);
      }
      for(const [toolId,positions] of byTool){
        const geometry=new LineSegmentsGeometry();
        geometry.setPositions(positions);
        geometry.instanceCount=0;
        const material=new LineMaterial({
          color:tools[toolId].three,
          linewidth:lineWidth,
          transparent:(tools[toolId].opacity??1)<1,
          opacity:tools[toolId].opacity??1,
          depthWrite:(tools[toolId].opacity??1)>=1
        });
        applyExtrusionShading(material,tools[toolId]);
        material.resolution.set(stage.clientWidth||1,stage.clientHeight||1);
        const line=new LineSegments2(geometry,material);
        line.frustumCulled=false;
        printedGroup.add(line);
        printedLines.set(toolId,line);
        printedLineMaterials.push(material);
      }
    }

    function upperBound(arr,value){
      let lo=0,hi=arr.length;
      while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<=value)lo=mid+1;else hi=mid}
      return lo;
    }

    function timelineEntryAt(time){
      let lo=0,hi=timeline.length-1;
      while(lo<hi){const mid=(lo+hi)>>1;if(timeline[mid].end<time)lo=mid+1;else hi=mid}
      return timeline[lo];
    }

    function renderLiveExtrusion(segment,part,currentPoint){
      if(!segment?.extrude || part<=0 || part>=1){
        liveLine.visible=false;
        return;
      }
      const positions=[
        segment.a.x,segment.a.y,segment.a.z,
        currentPoint.x,currentPoint.y,currentPoint.z
      ];
      liveGeometry.setPositions(positions);
      const liveTool=tools[segment.tool];
      liveMaterial.color.setHex(liveTool.three);
      liveMaterial.opacity=liveTool.opacity??1;
      liveMaterial.transparent=(liveTool.opacity??1)<1;
      liveMaterial.depthWrite=(liveTool.opacity??1)>=1;
      liveLine.visible=true;
    }

    function renderProgress(animateIndicator=true){
      if(!timeline.length||!totalDuration)return;
      const time=Math.max(0,Math.min(totalDuration,progress*totalDuration));
      const entry=timelineEntryAt(time);
      let currentPoint=segments[0].a.clone();
      let desiredTool=segments[0].tool;
      let animateTool=false;

      if(entry.type==='pause'){
        currentPoint=entry.point.clone();
        liveLine.visible=false;
        const remaining=entry.end-time;
        if(remaining<=1){
          desiredTool=entry.toTool;
          animateTool=animateIndicator;
        }else{
          desiredTool=entry.fromTool;
        }
      }else{
        const s=entry.segment;
        const span=Math.max(.0001,entry.end-entry.start);
        const part=Math.max(0,Math.min(1,(time-entry.start)/span));
        currentPoint=s.a.clone().lerp(s.b,part);
        desiredTool=s.tool;
        renderLiveExtrusion(s,part,currentPoint);
      }

      if(desiredTool!==activeTool)moveToolIndicator(desiredTool,animateTool);

      for(const [toolId,line] of printedLines){
        line.geometry.instanceCount=upperBound(renderedEndTimes.get(toolId)||[],time);
      }

      // The G-code position is the physical extrusion point. Offset the visual
      // head so the flat nozzle outlet, not the group's origin, sits there.
      headGroup.position.copy(currentPoint);
      headGroup.position.y-=nozzleOutletY;
      const pct=Math.max(0,Math.min(100,progress*100));
      progressFill.style.width=pct+'%';
      progressThumb.style.left=pct+'%';
    }

    async function setModel(name){
      currentModel=name;
      tools=modelConfigs[name].tools;
      liveLine.visible=false;
      if(name==='clock')buildClock();
      else await buildPackedModel(name);
      progress=0;
      buildToolList();
      buildTimeline();
      buildPrintedLines();
      renderProgress(false);
      document.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('active',b.dataset.model===name));
      last=performance.now();
    }

    function seekFromEvent(e){
      const bar=progressWrap.querySelector('.progress').getBoundingClientRect();
      progress=Math.max(0,Math.min(1,(e.clientX-bar.left)/bar.width));
      renderProgress(false);
      last=performance.now();
    }
    progressWrap.addEventListener('pointerdown',e=>{
      seeking=true;progressWrap.setPointerCapture(e.pointerId);seekFromEvent(e);
    });
    progressWrap.addEventListener('pointermove',e=>{if(seeking)seekFromEvent(e)});
    progressWrap.addEventListener('pointerup',e=>{
      seeking=false;progressWrap.releasePointerCapture(e.pointerId);last=performance.now();
    });
    progressWrap.addEventListener('pointercancel',()=>{seeking=false;last=performance.now()});

    // Suppress double-tap / pinch zoom on iOS without breaking normal taps or drag-to-orbit.
    let lastTouchEnd=0;
    document.addEventListener('touchend',e=>{
      const now=Date.now();
      if(now-lastTouchEnd<=350)e.preventDefault();
      lastTouchEnd=now;
    },{passive:false});
    document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});

    const overlay=document.querySelector('.overlay');
    document.querySelector('.hamb').addEventListener('click',()=>overlay.classList.add('open'));
    document.querySelector('.close').addEventListener('click',()=>overlay.classList.remove('open'));
    const setLang=l=>{
      document.body.classList.toggle('en',l==='en');
      localStorage.setItem('ucl-lang',l);
      document.querySelectorAll('[data-setlang]').forEach(b=>b.classList.toggle('active',b.dataset.setlang===l));
    };
    document.querySelectorAll('[data-setlang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.setlang)));
    setLang(localStorage.getItem('ucl-lang')||'ja');

    document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',async()=>{
      try{await setModel(b.dataset.model)}catch(err){console.error(err)}
    }));
    document.querySelectorAll('[data-head]').forEach(b=>b.addEventListener('click',()=>{
      const on=b.dataset.head==='on';
      headGroup.visible=on;
      document.querySelectorAll('[data-head]').forEach(x=>x.classList.toggle('active',x===b));
    }));

    function resize(){
      const w=stage.clientWidth,h=stage.clientHeight;
      renderer.setSize(w,h,false);
      camera.aspect=w/h;
      camera.fov=w<=700?36:32;
      camera.updateProjectionMatrix();
      printedLineMaterials.forEach(m=>m.resolution.set(w,h));
      liveMaterial.resolution.set(w,h);
    }
    window.addEventListener('resize',resize);
    resize();

    headGroup.visible=true;

    await setModel('clock');

    function animate(now){
      requestAnimationFrame(animate);
      const dt=Math.min(.05,(now-last)/1000);
      last=now;
      if(!seeking && !overlay.classList.contains('open') && progress<1 && totalDuration>0){
        progress=Math.min(1,progress+dt/totalDuration);
        renderProgress(true);
      }
      controls.update();
      renderer.render(scene,camera);
    }
    requestAnimationFrame(animate);
    setTimeout(()=>hint.classList.add('hide'),3200);
  </script>
</body>
</html>
