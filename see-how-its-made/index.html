<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f3f1ec">
  <title>Print — USAGI Craft Lab.</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f1ec;color:#111;font-family:Arial,"Helvetica Neue","Noto Sans JP",sans-serif}
    button,input{font:inherit}
    #app{position:relative;width:100%;height:100%;background:var(--bg,#f3f1ec);transition:background .25s ease}
    #stage{position:absolute;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    canvas{display:block;width:100%;height:100%}
    .menu-button{position:absolute;top:22px;right:4vw;z-index:20;width:44px;height:44px;border:0;background:transparent;color:var(--fg,#111);cursor:pointer;padding:0;display:grid;place-items:center}
    .menu-button span,.menu-button span:before,.menu-button span:after{content:"";display:block;width:24px;height:1px;background:currentColor;position:relative;transition:.2s}
    .menu-button span:before{position:absolute;top:-7px}
    .menu-button span:after{position:absolute;top:7px}
    .hud{position:absolute;left:4vw;right:4vw;bottom:max(28px,env(safe-area-inset-bottom));z-index:10;pointer-events:none;color:var(--fg,#111)}
    .tool-list{position:absolute;left:4vw;top:50%;z-index:12;transform:translateY(-50%);color:var(--fg,#111);font-size:13px;line-height:1;letter-spacing:.01em;pointer-events:none}
    .tool-list-inner{position:relative}
    .tool-item{height:32px;display:flex;align-items:center;padding:0 10px;white-space:nowrap}
    .tool-indicator{position:absolute;left:0;top:0;width:100%;height:32px;border:1px solid currentColor;pointer-events:none;transition:transform 1s cubic-bezier(.22,.61,.36,1)}
    .progress-wrap{height:28px;display:flex;align-items:center;pointer-events:auto;touch-action:pan-y}
    .progress{position:relative;width:100%;height:2px;background:color-mix(in srgb,var(--fg,#111) 22%,transparent);cursor:pointer}
    .progress-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--fg,#111)}
    .progress-thumb{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:var(--fg,#111);transform:translate(-50%,-50%);border:0}
    .panel{position:absolute;inset:0;z-index:30;background:var(--bg,#f3f1ec);color:var(--fg,#111);display:none;padding:22px 4vw 36px;overflow:auto}
    .panel.open{display:block}
    .panel-head{display:flex;justify-content:flex-end}
    .close{width:44px;height:44px;border:0;background:transparent;color:inherit;font-size:30px;line-height:1;cursor:pointer;padding:0}
    .panel-body{max-width:680px;margin:8vh 0 0 auto;width:min(100%,680px)}
    .group{border-top:1px solid color-mix(in srgb,var(--fg,#111) 32%,transparent);padding:20px 0 34px}
    .group-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 18px;opacity:.58}
    .choice{display:flex;width:100%;min-height:48px;align-items:center;justify-content:space-between;border:0;background:transparent;color:inherit;padding:0;text-align:left;cursor:pointer;font-size:clamp(22px,3.2vw,38px);letter-spacing:-.035em}
    .choice .mark{font-size:13px;opacity:0}
    .choice.active .mark{opacity:1}
    .toggle-row{display:flex;gap:8px;flex-wrap:wrap}
    .pill{min-height:44px;border:1px solid color-mix(in srgb,var(--fg,#111) 30%,transparent);background:transparent;color:inherit;padding:0 18px;border-radius:999px;cursor:pointer}
    .pill.active{background:var(--fg,#111);color:var(--bg,#f3f1ec)}
    .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.04em;opacity:.38;pointer-events:none;transition:opacity 1.2s ease;color:var(--fg,#111);white-space:nowrap}
    .hint.hide{opacity:0}
    @media(max-width:700px){
      .menu-button{top:14px;right:14px}
      .hud{left:18px;right:18px;bottom:max(20px,env(safe-area-inset-bottom))}
      .panel{padding:14px 18px 30px}
      .panel-body{margin-top:6vh}
      .tool-list{left:18px;font-size:12px}
      .tool-item,.tool-indicator{height:30px}
    }
    @media(prefers-reduced-motion:reduce){#app,.hint{transition:none}}
  </style>
</head>
<body>
  <main id="app">
    <div id="stage" aria-label="3D printing simulation"></div>

    <button class="menu-button" id="menuButton" type="button" aria-label="Open settings"><span></span></button>

    <div class="hint" id="hint">drag to change view</div>

    <div class="tool-list" id="toolList" aria-live="polite">
      <div class="tool-list-inner" id="toolListInner"></div>
    </div>

    <div class="hud">
      <div class="progress-wrap" id="progressWrap" aria-label="Print progress">
        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>
    </div>

    <aside class="panel" id="panel" aria-label="Settings">
      <div class="panel-head"><button class="close" id="closeButton" type="button" aria-label="Close settings">×</button></div>
      <div class="panel-body">
        <section class="group">
          <p class="group-label">Model</p>
          <button class="choice active" type="button" data-model="vessel"><span>Vessel / test 01</span><span class="mark">●</span></button>
          <button class="choice" type="button" data-model="grid"><span>Grid / test 02</span><span class="mark">●</span></button>
        </section>
        <section class="group">
          <p class="group-label">Print head</p>
          <div class="toggle-row">
            <button class="pill active" type="button" data-head="on">On</button>
            <button class="pill" type="button" data-head="off">Off</button>
          </div>
        </section>
        <section class="group">
          <p class="group-label">Background</p>
          <div class="toggle-row">
            <button class="pill active" type="button" data-bg="warm">Warm white</button>
            <button class="pill" type="button" data-bg="white">White</button>
            <button class="pill" type="button" data-bg="gray">Gray</button>
            <button class="pill" type="button" data-bg="black">Black</button>
          </div>
        </section>
      </div>
    </aside>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app=document.getElementById('app');
    const stage=document.getElementById('stage');
    const toolListInner=document.getElementById('toolListInner');
    const progressWrap=document.getElementById('progressWrap');
    const progressFill=document.getElementById('progressFill');
    const progressThumb=document.getElementById('progressThumb');
    const panel=document.getElementById('panel');
    const hint=document.getElementById('hint');

    const themes={
      warm:{bg:'#f3f1ec',fg:'#111111',scene:0xf3f1ec},
      white:{bg:'#ffffff',fg:'#111111',scene:0xffffff},
      gray:{bg:'#b8b8b5',fg:'#111111',scene:0xb8b8b5},
      black:{bg:'#101010',fg:'#f1f1ee',scene:0x101010}
    };
    const tools={
      1:{name:'red',css:'#d74435',three:0xd74435},
      2:{name:'transparent',css:'rgba(220,226,224,.72)',three:0xdce2e0},
      3:{name:'blue',css:'#315f9a',three:0x315f9a}
    };

    const scene=new THREE.Scene();
    scene.background=new THREE.Color(themes.warm.scene);
    const camera=new THREE.PerspectiveCamera(32,1,.1,2000);
    camera.position.set(180,125,220);

    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.enablePan=false;
    controls.enableZoom=false;
    controls.target.set(0,42,0);
    controls.minPolarAngle=Math.PI*.16;
    controls.maxPolarAngle=Math.PI*.82;
    controls.addEventListener('start',()=>hint.classList.add('hide'));

    scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.1));
    const key=new THREE.DirectionalLight(0xffffff,2.4);
    key.position.set(140,220,160);
    scene.add(key);

    const bed=new THREE.Mesh(
      new THREE.BoxGeometry(210,2.2,210),
      new THREE.MeshPhysicalMaterial({
        color:0xcfd2d0,
        roughness:.58,
        metalness:0,
        transparent:true,
        opacity:.34,
        transmission:.08,
        depthWrite:false
      })
    );
    bed.position.y=-2.2;
    scene.add(bed);

    const printedGroup=new THREE.Group();
    scene.add(printedGroup);

    const headGroup=new THREE.Group();

    // Simplified Nextruder-inspired head, based on publicly available MK4S reference imagery.
    const headBlack=new THREE.MeshStandardMaterial({color:0x202020,roughness:.72,metalness:.03});
    const headDark=new THREE.MeshStandardMaterial({color:0x343434,roughness:.62,metalness:.06});
    const headOrange=new THREE.MeshStandardMaterial({color:0xf06b28,roughness:.55,metalness:.02});
    const headMetal=new THREE.MeshStandardMaterial({color:0xa7a7a4,roughness:.32,metalness:.68});
    const brass=new THREE.MeshStandardMaterial({color:0xb68a54,roughness:.3,metalness:.7});

    const carriage=new THREE.Mesh(new THREE.BoxGeometry(48,8,18),headDark);
    carriage.position.set(0,38,2);

    const motor=new THREE.Mesh(new THREE.BoxGeometry(31,29,31),headDark);
    motor.position.set(0,31,3);

    const mainHousing=new THREE.Mesh(new THREE.BoxGeometry(42,35,34),headBlack);
    mainHousing.position.set(0,12,0);

    const frontPlate=new THREE.Mesh(new THREE.BoxGeometry(37,27,4),headBlack);
    frontPlate.position.set(0,13,19);

    const fanRing=new THREE.Mesh(
      new THREE.TorusGeometry(10.5,2.2,10,36),
      headDark
    );
    fanRing.rotation.x=Math.PI/2;
    fanRing.position.set(0,13,22);

    const fanHub=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,3.2,24),headDark);
    fanHub.rotation.x=Math.PI/2;
    fanHub.position.set(0,13,22);

    const fanBlades=new THREE.Group();
    for(let i=0;i<5;i++){
      const blade=new THREE.Mesh(new THREE.BoxGeometry(2.4,8,1.2),headDark);
      blade.position.y=4.5;
      blade.rotation.z=i*Math.PI*2/5+.22;
      fanBlades.add(blade);
    }
    fanBlades.rotation.x=Math.PI/2;
    fanBlades.position.set(0,13,22);

    const orangeBand=new THREE.Mesh(new THREE.BoxGeometry(43,3.2,35),headOrange);
    orangeBand.position.set(0,26.5,0);

    const heatsink=new THREE.Mesh(new THREE.CylinderGeometry(6.5,6.5,13,28),headMetal);
    heatsink.position.set(0,-8,0);

    const heaterBlock=new THREE.Mesh(new THREE.BoxGeometry(10,6,10),headMetal);
    heaterBlock.position.set(0,-17,0);

    const nozzle=new THREE.Mesh(
      new THREE.ConeGeometry(2.5,10,24),
      brass
    );
    nozzle.rotation.x=Math.PI;
    nozzle.position.y=-25;

    const sideFanHousing=new THREE.Mesh(new THREE.BoxGeometry(13,24,26),headBlack);
    sideFanHousing.position.set(27,9,-1);

    const sideFan=new THREE.Mesh(new THREE.CylinderGeometry(8.2,8.2,3,28),headDark);
    sideFan.rotation.z=Math.PI/2;
    sideFan.position.set(34,10,-1);

    const filamentGuide=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,17,16),headOrange);
    filamentGuide.position.set(0,51,3);

    headGroup.add(
      carriage,motor,mainHousing,frontPlate,fanRing,fanHub,fanBlades,
      orangeBand,heatsink,heaterBlock,nozzle,sideFanHousing,sideFan,filamentGuide
    );
    scene.add(headGroup);

    let segments=[];
    let cumulative=[];
    let totalLength=0;
    let progress=0;
    let currentModel='vessel';
    let seeking=false;
    let last=performance.now();
    let activeTool=null;
    let displayedTools=[];
    let toolIndicator=null;
    let toolPauseUntil=0;
    let pendingTool=null;
    const printSpeed=22; // scene units per real second for the test path

    function pushSegment(a,b,tool){
      const len=a.distanceTo(b);
      if(len<.001)return;
      segments.push({a:a.clone(),b:b.clone(),tool,len});
      totalLength+=len;
      cumulative.push(totalLength);
    }

    function modelToolOrder(){
      const order=[];
      for(const s of segments){
        if(!order.includes(s.tool))order.push(s.tool);
      }
      return order;
    }

    function buildToolList(){
      displayedTools=modelToolOrder();
      toolListInner.innerHTML='';
      displayedTools.forEach(id=>{
        const row=document.createElement('div');
        row.className='tool-item';
        row.dataset.tool=String(id);
        row.textContent='Tool '+id+': '+tools[id].name;
        toolListInner.appendChild(row);
      });
      toolIndicator=document.createElement('div');
      toolIndicator.className='tool-indicator';
      toolListInner.appendChild(toolIndicator);
      activeTool=displayedTools[0]||1;
      moveToolIndicator(activeTool,false);
    }

    function moveToolIndicator(toolId,animate=true){
      if(!toolIndicator)return;
      const index=Math.max(0,displayedTools.indexOf(toolId));
      const row=toolListInner.querySelector('.tool-item');
      const rowHeight=row?row.getBoundingClientRect().height:32;
      toolIndicator.style.transitionDuration=animate?'1s':'0s';
      toolIndicator.style.transform='translateY('+(index*rowHeight)+'px)';
      if(!animate)requestAnimationFrame(()=>{if(toolIndicator)toolIndicator.style.transitionDuration='1s'});
      activeTool=toolId;
    }

    function toolAtProgress(p){
      const target=p*totalLength;
      let used=0;
      for(const s of segments){
        if(target<=used+s.len)return s.tool;
        used+=s.len;
      }
      return segments.at(-1)?.tool||1;
    }

    function nextToolBoundary(fromProgress,toProgress){
      if(toProgress<=fromProgress)return null;
      const start=fromProgress*totalLength;
      const end=toProgress*totalLength;
      let used=0;
      let previousTool=segments[0]?.tool||1;
      for(const s of segments){
        const segStart=used;
        if(segStart>start && segStart<=end && s.tool!==previousTool){
          return {progress:segStart/totalLength,tool:s.tool};
        }
        previousTool=s.tool;
        used+=s.len;
      }
      return null;
    }

    function buildVessel(){
      segments=[];cumulative=[];totalLength=0;
      const layers=44,points=76;
      let previous=null;
      for(let l=0;l<layers;l++){
        const y=1.4+l*1.65;
        const t=l/(layers-1);
        const radius=34+8*Math.sin(t*Math.PI)-3*t;
        const tool=l<16?1:(l<29?2:1);
        for(let i=0;i<=points;i++){
          const a=(i/points)*Math.PI*2 + l*.055;
          const wobble=1+0.035*Math.sin(a*3+l*.22);
          const p=new THREE.Vector3(Math.cos(a)*radius*wobble,y,Math.sin(a)*radius*wobble);
          if(previous)pushSegment(previous,p,tool);
          previous=p;
        }
      }
    }

    function buildGrid(){
      segments=[];cumulative=[];totalLength=0;
      let prev=null;
      const layers=34;
      for(let l=0;l<layers;l++){
        const y=1.5+l*1.8;
        const tool=l<11?3:(l<23?1:2);
        const size=68-l*.35;
        const pts=[
          new THREE.Vector3(-size/2,y,-size/2),
          new THREE.Vector3(size/2,y,-size/2),
          new THREE.Vector3(size/2,y,size/2),
          new THREE.Vector3(-size/2,y,size/2),
          new THREE.Vector3(-size/2,y,-size/2)
        ];
        for(const p of pts){if(prev)pushSegment(prev,p,tool);prev=p}
        const stripes=7;
        for(let s=0;s<stripes;s++){
          const q=-size/2+(size/(stripes-1))*s;
          const a=l%2===0?new THREE.Vector3(-size/2,y,q):new THREE.Vector3(q,y,-size/2);
          const b=l%2===0?new THREE.Vector3(size/2,y,q):new THREE.Vector3(q,y,size/2);
          pushSegment(prev,a,tool);pushSegment(a,b,tool);prev=b;
        }
      }
    }

    function makeLine(a,b,tool,partial=1){
      const end=a.clone().lerp(b,partial);
      const dir=end.clone().sub(a);
      const len=dir.length();
      if(len<.001)return null;
      const mat=new THREE.MeshStandardMaterial({
        color:tools[tool].three,
        roughness:.72,
        metalness:0,
        transparent:tool===2,
        opacity:tool===2?.58:1,
        depthWrite:tool!==2
      });
      const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.82,.82,len,7,1,false),mat);
      mesh.position.copy(a).add(end).multiplyScalar(.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
      return mesh;
    }

    function clearPrinted(){
      while(printedGroup.children.length){
        const o=printedGroup.children.pop();
        o.geometry?.dispose();o.material?.dispose();
      }
    }

    function renderProgress(){
      clearPrinted();
      const target=progress*totalLength;
      let used=0,currentTool=segments[0]?.tool||1,currentPoint=segments[0]?.a||new THREE.Vector3();
      for(const s of segments){
        if(used>=target)break;
        const remain=target-used;
        const part=Math.min(1,remain/s.len);
        const mesh=makeLine(s.a,s.b,s.tool,part);
        if(mesh)printedGroup.add(mesh);
        currentTool=s.tool;
        currentPoint=s.a.clone().lerp(s.b,part);
        used+=Math.min(s.len,remain);
        if(part<1)break;
      }
      headGroup.position.copy(currentPoint);
      headGroup.position.y+=25;
      if(!toolPauseUntil && currentTool!==activeTool)moveToolIndicator(currentTool,false);
      const pct=Math.max(0,Math.min(100,progress*100));
      progressFill.style.width=pct+'%';
      progressThumb.style.left=pct+'%';
    }

    function setModel(name){
      currentModel=name;
      name==='grid'?buildGrid():buildVessel();
      progress=0;
      toolPauseUntil=0;
      pendingTool=null;
      buildToolList();
      renderProgress();
      document.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('active',b.dataset.model===name));
      panel.classList.remove('open');
      last=performance.now();
    }

    function seekFromEvent(e){
      const bar=progressWrap.querySelector('.progress').getBoundingClientRect();
      progress=Math.max(0,Math.min(1,(e.clientX-bar.left)/bar.width));
      toolPauseUntil=0;
      pendingTool=null;
      moveToolIndicator(toolAtProgress(progress),false);
      renderProgress();
      last=performance.now();
    }
    progressWrap.addEventListener('pointerdown',e=>{
      seeking=true;progressWrap.setPointerCapture(e.pointerId);seekFromEvent(e);
    });
    progressWrap.addEventListener('pointermove',e=>{if(seeking)seekFromEvent(e)});
    progressWrap.addEventListener('pointerup',e=>{
      seeking=false;progressWrap.releasePointerCapture(e.pointerId);last=performance.now();
    });
    progressWrap.addEventListener('pointercancel',()=>{seeking=false;last=performance.now()});

    // Prevent iOS double-tap zoom while keeping single-tap and drag interactions.
    let lastTouchEnd=0;
    document.addEventListener('touchend',e=>{
      const now=Date.now();
      if(now-lastTouchEnd<=300)e.preventDefault();
      lastTouchEnd=now;
    },{passive:false});
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});

    document.getElementById('menuButton').addEventListener('click',()=>panel.classList.add('open'));
    document.getElementById('closeButton').addEventListener('click',()=>panel.classList.remove('open'));
    document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>setModel(b.dataset.model)));
    document.querySelectorAll('[data-head]').forEach(b=>b.addEventListener('click',()=>{
      const on=b.dataset.head==='on';
      headGroup.visible=on;
      document.querySelectorAll('[data-head]').forEach(x=>x.classList.toggle('active',x===b));
    }));
    document.querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click',()=>{
      const theme=themes[b.dataset.bg];
      app.style.setProperty('--bg',theme.bg);
      app.style.setProperty('--fg',theme.fg);
      scene.background=new THREE.Color(theme.scene);
      document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('active',x===b));
    }));

    function resize(){
      const w=stage.clientWidth,h=stage.clientHeight;
      renderer.setSize(w,h,false);
      camera.aspect=w/h;camera.updateProjectionMatrix();
    }
    window.addEventListener('resize',resize);
    resize();

    buildVessel();
    buildToolList();
    renderProgress();

    function animate(now){
      requestAnimationFrame(animate);
      const dt=Math.min(.05,(now-last)/1000);
      last=now;
      if(!seeking && !panel.classList.contains('open') && progress<1 && totalLength>0){
        if(toolPauseUntil){
          if(now>=toolPauseUntil){
            toolPauseUntil=0;
            if(pendingTool!==null){
              activeTool=pendingTool;
              pendingTool=null;
            }
            last=now;
          }
        }else{
          const nextProgress=Math.min(1,progress+(printSpeed*dt)/totalLength);
          const boundary=nextToolBoundary(progress,nextProgress);
          if(boundary){
            progress=boundary.progress;
            pendingTool=boundary.tool;
            moveToolIndicator(boundary.tool,true);
            toolPauseUntil=now+1000;
            renderProgress();
          }else{
            progress=nextProgress;
            renderProgress();
          }
        }
      }
      controls.update();
      renderer.render(scene,camera);
    }
    requestAnimationFrame(animate);
    setTimeout(()=>hint.classList.add('hide'),3200);
  </script>
</body>
</html>
